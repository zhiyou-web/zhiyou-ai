<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>即梦AI全能版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}
body{background:#f5f7fa;height:100vh;display:flex;flex-direction:column}
.header{background:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #eee}
.logo{width:32px;height:32px;background:#5b6ff0;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:bold}
.title{font-size:17px;font-weight:600}
#mode{margin-left:auto;padding:6px 12px;border:1px solid #ddd;border-radius:12px;outline:none;background:#fff}
.chat{flex:1;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.msg{max-width:80%;padding:10px 14px;border-radius:16px;line-height:1.4}
.user{align-self:flex-end;background:#5b6ff0;color:#fff;border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:#fff;border:1px solid #eee;border-bottom-left-radius:4px}
.upload{margin:6px 0}
.upload input{width:100%;margin-top:4px}
.result-img{max-width:100%;border-radius:12px;margin-top:8px}
.result-video{max-width:100%;border-radius:12px;margin-top:8px}
.loading{color:#666;font-style:italic}
.input-bar{background:#fff;padding:12px 20px;display:flex;gap:10px;border-top:1px solid #eee}
#prompt{flex:1;padding:12px 16px;border:1px solid #ddd;border-radius:24px;outline:none}
button{padding:12px 20px;border:none;border-radius:24px;background:#5b6ff0;color:#fff;cursor:pointer}
.clear{background:#f1f3f5;color:#333}
.panel{display:none;margin:6px 0}
</style>
</head>
<body>

<div class="header">
  <div class="logo">AI</div>
  <div class="title">即梦AI全能版</div>
  <select id="mode">
    <option value="text2img">文生图</option>
    <option value="text2video">文生视频</option>
    <option value="img2video">图生视频</option>
    <option value="headtail2video">首尾帧生视频</option>
    <option value="ref2video">全能参考生视频</option>
  </select>
</div>

<div class="chat" id="chat"></div>

<div class="panel" id="p_img2video">
  <div class="upload"><input type="file" id="img1" accept="image/*"></div>
</div>
<div class="panel" id="p_headtail">
  <div class="upload"><input type="file" id="head" accept="image/*"></div>
  <div class="upload"><input type="file" id="tail" accept="image/*"></div>
</div>
<div class="panel" id="p_ref">
  <div class="upload"><input type="file" id="refs" accept="image/*" multiple></div>
</div>

<div class="input-bar">
  <input id="prompt" placeholder="输入描述词">
  <button onclick="send()">生成</button>
  <button class="clear" onclick="clearChat()">清空</button>
</div>

<script>
const chat = document.getElementById('chat');
const prompt = document.getElementById('prompt');
const mode = document.getElementById('mode');

const panels = {
  text2img: null,
  text2video: null,
  img2video: document.getElementById('p_img2video'),
  headtail2video: document.getElementById('p_headtail'),
  ref2video: document.getElementById('p_ref')
};

let history = JSON.parse(localStorage.getItem('jimeng_full_history') || '[]');

mode.addEventListener('change', () => {
  Object.values(panels).forEach(p => p && (p.style.display = 'none'));
  const p = panels[mode.value];
  if (p) p.style.display = 'block';
});

function loadHistory() {
  chat.innerHTML = '';
  history.forEach(h => addMsg(h.text, h.isUser, h.kind, h.url));
}

function addMsg(text, isUser, kind = '', url = '') {
  const div = document.createElement('div');
  div.className = `msg ${isUser ? 'user' : 'bot'}`;
  div.innerText = text;
  if (kind === 'img') {
    const img = new Image();
    img.src = url; img.className = 'result-img';
    div.appendChild(img);
  }
  if (kind === 'video') {
    const video = document.createElement('video');
    video.src = url; video.controls = true; video.className = 'result-video';
    div.appendChild(video);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function showLoading(text) {
  const div = document.createElement('div');
  div.className = 'msg bot loading';
  div.innerText = text; div.id = 'loading';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function hideLoading() {
  const el = document.getElementById('loading');
  if (el) el.remove();
}

async function send() {
  const text = prompt.value.trim();
  if (!text) return;
  addMsg(text, true);
  prompt.value = '';
  history.push({ text, isUser: true });

  showLoading('正在生成，请稍候…');

  const fd = new FormData();
  fd.append('prompt', text);
  fd.append('mode', mode.value);

  if (mode.value === 'img2video') {
    const f = document.getElementById('img1').files[0];
    if (f) fd.append('img1', f);
  }
  if (mode.value === 'headtail2video') {
    const h = document.getElementById('head').files[0];
    const t = document.getElementById('tail').files[0];
    if (h) fd.append('head', h);
    if (t) fd.append('tail', t);
  }
  if (mode.value === 'ref2video') {
    const fs = document.getElementById('refs').files;
    for (let i = 0; i < fs.length; i++) fd.append('refs[]', fs[i]);
  }

  try {
    const r = await fetch('/api/generate', { method: 'POST', body: fd });
    const data = await r.json();
    hideLoading();
    const kind = data.type === 'image' ? 'img' : 'video';
    const reply = kind === 'img' ? '图片生成完成' : '视频生成完成';
    addMsg(reply, false, kind, data.url);
    history.push({ text: reply, isUser: false, kind, url: data.url });
    localStorage.setItem('jimeng_full_history', JSON.stringify(history));
  } catch (e) {
    hideLoading();
    addMsg('生成失败：' + e.message, false);
  }
}

function clearChat() {
  history = [];
  localStorage.removeItem('jimeng_full_history');
  chat.innerHTML = '';
}

prompt.addEventListener('keydown', e => e.key === 'Enter' && send());
mode.dispatchEvent(new Event('change'));
loadHistory();
</script>
</body>
</html>
